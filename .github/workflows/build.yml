name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auction-hud-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: auction-hud-jar
          path: auction-hud-mod/build/libs/auction-hud-1.0.0.jar
